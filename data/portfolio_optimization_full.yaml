# Portfolio Optimization — Full S&P 500 — demo data file
# This is the large, real-data scenario from the same original notebook
# as "Portfolio Optimization" — real S&P 500 returns/covariance from
# 2016-01-01, partitioned across many QAOA sub-problems in parallel.
# Default parameters are tuned for fast, responsive demo execution (~25s).
# For deeper optimization, scale up max_iterations (e.g. 5-10) and population_size (e.g. 20-30).

lambda_param: 0.75    # risk-aversion weight in the QUBO

partitioning:
  max_partition_size: 20    # max assets per QAOA sub-problem
  method: "modularity"
  seed: 42

qaoa:
  n_layers: 2
  max_iterations: 2         # tuned for interactive demo speed (raise to 10 for full optimization)
  population_size: 10       # candidate parameter vectors per iteration (raise to 30 for production)
  n_best_sets: 3
  early_stopping_patience: 2

aggregation:
  beam_width: 3
  n_partition_candidates: 5

backend:
  use_cloud: false     # true = QoroService, false = local MaestroSimulator
  shots: 1000          # 1000 shots is fast and sufficient for demo; 10000 for high precision
