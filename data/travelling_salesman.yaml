# Travelling Salesman Problem — demo data file
# Covers "Part A: Direct QAOA" from the original demo — a small,
# fully-connected-qubit instance. See the separate "Travelling Salesman —
# Partitioned" and "Travelling Salesman — PCE Compression" demos for the
# other two scenarios from the same original script.

n_cities: 4
seed: 42

qaoa:
  n_layers: 3
  max_iterations: 10

backend:
  use_cloud: false     # true = QoroService, false = local MaestroSimulator
  shots: 20000
