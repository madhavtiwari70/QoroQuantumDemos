# Portfolio Optimization — demo data file
# Covers the small synthetic-portfolio part of the original notebook.
# See the separate "Portfolio Optimization — Full S&P 500" demo for the
# real 480-asset, partitioned-QAOA scenario from the same notebook.

n_assets: 8
seed: 42
lambda_param: 0.75    # risk-aversion weight in the QUBO

qaoa:
  n_layers: 2
  max_iterations: 10
  population_size: 30
  n_best_sets: 5

backend:
  use_cloud: false     # true = QoroService, false = local MaestroSimulator
  shots: 10000
